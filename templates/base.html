<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BTC Trader{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; display: flex; min-height: 100vh; }
        nav.sidebar { width: 200px; flex-shrink: 0; background: #111827; color: #e5e7eb; padding: 1rem; }
        nav.sidebar a { display: block; color: #e5e7eb; text-decoration: none; padding: 0.5rem 0; }
        nav.sidebar a:hover { color: #fff; }
        main { flex: 1; padding: 1.5rem; min-width: 0; }
        .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .ok { color: #16a34a; }
        .bad { color: #dc2626; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; }
        .grid-cards .card { margin-bottom: 0; }
        .grid-cards .value { font-size: 1.4rem; font-weight: 600; }
        .grid-cards .label { color: #6b7280; font-size: 0.85rem; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #e5e7eb; text-align: left; white-space: nowrap; }
        .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.8rem; }
        .badge-queued, .badge-running { background: #fef3c7; color: #92400e; }
        .badge-completed { background: #dcfce7; color: #166534; }
        .badge-failed { background: #fee2e2; color: #991b1b; }
        form.stacked label { display: block; margin: 0.6rem 0 0.2rem; }
        form.stacked input, form.stacked select { padding: 0.4rem; border: 1px solid #d1d5db; border-radius: 4px; width: 100%; max-width: 320px; }
        .btn { display: inline-block; padding: 0.5rem 1rem; background: #111827; color: #fff; border: none; border-radius: 4px; text-decoration: none; cursor: pointer; }
        .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
        .chart { height: 300px; margin-bottom: 1.5rem; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            nav.sidebar { width: 100%; display: flex; overflow-x: auto; align-items: center; gap: 1rem; padding: 0.75rem 1rem; }
            nav.sidebar strong, nav.sidebar a { white-space: nowrap; padding: 0.25rem 0; }
            main { padding: 1rem; }
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <strong>BTC Trader</strong>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="/admin/market/">Market Data</a>
        <a href="/admin/strategy/">Strategies</a>
        <a href="{% url 'backtest-list' %}">Backtests</a>
        <a href="{% url 'walk-forward-list' %}">Models</a>
        <a href="{% url 'agent-pipeline-list' %}">AI Agents</a>
        <a href="/admin/trading/">Trading</a>
        <a href="/admin/">Settings</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
